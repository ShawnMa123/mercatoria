[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercatoria"
version = "0.1.0"
description = "Lightweight import/export legal retrieval and answer service"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29"
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
mercatoria = "mercatoria.cli:main"

[tool.setuptools]
packages = ["mercatoria"]
